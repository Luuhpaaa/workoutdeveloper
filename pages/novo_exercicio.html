<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Work Out - Cadastrar novo exercício</title>
</head>
<body>
  <header>
    <h1>WORK OUT</h1>
    <nav>
      <a href="../index.html">Início</a>
    </nav>
  </header>

  <main>
    <h2>Cadastrar novo exercício</h2>

    <form action="#" method="post">
      <label for="treino">Treino</label>
      <select id="treino" name="treino" required>
        <option value="">Selecione o treino</option>
        <option value="superiores">Superiores</option>
        <option value="inferiores">Inferiores</option>
        <option value="cardio">Cárdio Principal</option>
      </select>

      <h3>Exercícios do treino</h3>
      <table>
        <thead>
          <tr>
            <th>Exercício</th>
            <th>Séries</th>
            <th>Repetições</th>
            <th>Carga</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Supino</td>
            <td>4</td>
            <td>12</td>
            <td>20 kg</td>
          </tr>
          <tr>
            <td>Remada</td>
            <td>3</td>
            <td>10</td>
            <td>15 kg</td>
          </tr>
        </tbody>
      </table>

      <button type="submit">Salvar treino</button>
    </form>

    <section>
      <h3>Novo exercício</h3>
      <form action="#" method="post">
        <label for="nome-exercicio">Nome do exercício</label>
        <input type="text" id="nome-exercicio" name="nome-exercicio" required>

        <label for="series">Séries</label>
        <input type="number" id="series" name="series" min="1">

        <label for="repeticoes">Repetições</label>
        <input type="number" id="repeticoes" name="repeticoes" min="1">

        <label for="carga">Carga (kg)</label>
        <input type="number" id="carga" name="carga" min="0">

        <button type="submit">Adicionar exercício</button>
      </form>
    </section>
  </main>
</body>
</html>
