<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Out - Cadastrar novo treino</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header>
    <h1>WORK OUT</h1>
    <nav>
      <a href="../index.html">Início</a>
    </nav>
  </header>

  <main>
    <h2>Cadastrar novo treino</h2>
    
    <form action="#" method="post" class="form-container">
      <div class="card card_novotreino">
        
        <label for="nome-treino">Nome do treino</label>
        <input type="text" id="nome-treino" name="nome-treino" required>

        <div class="add_novoexercicio">
          <p class="subtitulo">Exercícios</p>
          
          <div class="busca-container">
            <input type="text" placeholder="Buscar exercício..." class="input-busca">
          </div>

          <div class="item-exercicio">
            <input type="radio" name="exercicio-selecionado" id="ex-supino" class="radio-toggle">
            <label for="ex-supino" class="label-exercicio">
              <span>Supino</span>
              <span class="btn-mais">+</span>
            </label>

            <div class="painel-detalhes">
              <div class="card card-detalhes-inner">
                <label for="series-supino">Séries</label>
                <input type="number" id="series-supino" name="series-supino">

                <label for="reps-supino">Repetições</label>
                <input type="text" id="reps-supino" name="reps-supino">

                <label for="tecnica-supino">Técnica</label>
                <input type="text" id="tecnica-supino" name="tecnica-supino">

                <label for="obs-supino">Observações</label>
                <textarea id="obs-supino" name="obs-supino" rows="3"></textarea>

                <button type="button" class="btn-adicionar-item">Adicionar</button>
              </div>
            </div>
          </div>


          <div class="item-exercicio">
            <input type="radio" name="exercicio-selecionado" id="ex-remada" class="radio-toggle">
            <label for="ex-remada" class="label-exercicio">
              <span>Remada</span>
              <span class="btn-mais">+</span>
            </label>

            <div class="painel-detalhes">
              <div class="card card-detalhes-inner">
                <label for="series-remada">Séries</label>
                <input type="number" id="series-remada" name="series-remada">

                <label for="reps-remada">Repetições</label>
                <input type="text" id="reps-remada" name="reps-remada">

                <label for="tecnica-remada">Técnica</label>
                <input type="text" id="tecnica-remada" name="tecnica-remada">

                <label for="obs-remada">Observações</label>
                <textarea id="obs-remada" name="obs-remada" rows="3"></textarea>

                <button type="button" class="btn-adicionar-item">Adicionar</button>
              </div>
            </div>
          </div>

        </div>

        <button type="submit" class="cadastrar">Cadastrar</button>

      </div>
    </form>
  </main>
</body>
</html>
