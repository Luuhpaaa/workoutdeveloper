<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Work Out - Cadastrar novo treino</title>
</head>
<body>
  <header>
    <h1>WORK OUT</h1>
    <nav>
      <a href="../index.html">Início</a>
    </nav>
  </header>

  <main>
    <h2>Cadastrar novo treino</h2>

    <form action="#" method="post">
      <label for="nome-treino">Nome do treino</label>
      <input type="text" id="nome-treino" name="nome-treino" required>

      <label for="exercicio">Exercício</label>
        <form action="/buscar" method="get">
        <select name="categoria">
        <option value="">Todas</option>
        <option value="Supino">Supino</option> 
        <option value="Barra lateral">Barra lateral</option>
        <option value="Cardio">Cardio</option>
      </select>

            <button type="submit">Adicionar</button>
      </form> 

      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao">

      <button type="submit">Cadastrar</button>
    </form>
  </main>
</body>
</html>
