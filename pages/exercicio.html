<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Work Out - Exercício cadastrado</title>
  
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header>
    <h1>WORK OUT</h1>
    <nav>
      <a href="../index.html">Início</a>
      <a href="relatorio.html">Relatórios</a>
    </nav>
  </header>

  <main>
    <h2>Treino: Superiores</h2>
    <section class="card">
      <div class="card_treino_exercicio">
      <div class=" card-treino">
      <ul>
        <li><a href="exercicio.html">Supino</a></li>
        <li><a href="exercicio.html">Remada</a></li>
        <li><a href="exercicio.html">Cardio</a></li>
      </ul>
      </div>
        <section class="card card_exercicio">
          <div class="card_detalhe">
            <div class="card">
              <div class="info_detalhe">
                <ul>
                  <li>Séries: 4</li>
                  <li>Repetições: 12</li>
                  <li>Carga: 20 kg</li>
                  <li>Tempo: 40 min</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <div class="form_detalhe">
                <form action="#" method="post">
                  <label for="carga-executada">Carga executada (kg)</label>
                  <div><input type="number" id="carga-executada" name="carga-executada"></div>

                  <label for="repeticoes-executadas">Repetições executadas</label>
                  <div><input type="number" id="repeticoes-executadas" name="repeticoes-executadas"></div>

                  <button type="submit">Salvar</button>
                </form>
              </div>
            </div>
          </div>
          
        </div>
      </section>
    </section>
  </main>
</body>
</html>
