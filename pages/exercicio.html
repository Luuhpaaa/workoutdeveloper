<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Work Out - Exercício cadastrado</title>
</head>
<body>
  <header>
    <h1>WORK OUT</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="relatorios.html">Relatórios</a>
    </nav>
  </header>

  <main>
    <h2>Treino: Superiores</h2>

    <section>
      <h3>Exercícios</h3>
      <ul>
        <li><a href="exercicio.html">Supino</a></li>
        <li><a href="exercicio.html">Remada</a></li>
        <li><a href="exercicio.html">Cardio</a></li>
      </ul>
    </section>

    <aside>
      <h3>Supino</h3>
      <dl>
        <dt>Séries</dt>
        <dd>4</dd>
        <dt>Repetições</dt>
        <dd>12</dd>
        <dt>Carga</dt>
        <dd>20 kg</dd>
        <dt>Tempo</dt>
        <dd>40 min</dd>
      </dl>

      <form action="#" method="post">
        <h4>Registrar execução</h4>
        <label for="carga-executada">Carga executada (kg)</label>
        <input type="number" id="carga-executada" name="carga-executada">

        <label for="repeticoes-executadas">Repetições executadas</label>
        <input type="number" id="repeticoes-executadas" name="repeticoes-executadas">

        <button type="submit">Salvar</button>
      </form>
    </aside>
  </main>
</body>
</html>
